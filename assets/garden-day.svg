<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">RainFoam's morning garden</title>
<desc id="desc">Blue and lilac flowers open and sway around a resting cat. A small garden for small ideas.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f5f7fc"/><stop offset="1" stop-color="#e5edf2"/></linearGradient><radialGradient id="halo"><stop stop-color="#dbe5ff" stop-opacity=".15"/><stop offset="1" stop-color="#dbe5ff" stop-opacity="0"/></radialGradient></defs>
<style>
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes bloom{0%,8%{transform:scale(.2);opacity:.3}28%,85%{transform:scale(1);opacity:1}100%{transform:scale(.2);opacity:.3}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:.9}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-9px)}}
.plant{animation:sway 7s ease-in-out infinite}.bloom{animation:bloom 18s ease-in-out infinite}.light{animation:glow 6s ease-in-out infinite}.fly{animation:float 9s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.plant,.bloom,.light,.fly{animation:none}}
</style>
